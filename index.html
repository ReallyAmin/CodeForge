<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeForge</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  transition: 0.3s;
}

.dark { background:#0b0f1a; color:white; }
.light { background:#f4f4f4; color:black; }

header {
  display:flex;
  justify-content:space-between;
  padding:12px;
  background:#111827;
  color:white;
  align-items:center;
}

.logo {
  color:#38bdf8;
  font-weight:bold;
}

.btn {
  background:#38bdf8;
  border:none;
  padding:6px 10px;
  margin-left:5px;
  cursor:pointer;
  border-radius:5px;
}

.container {
  display:flex;
  height:90vh;
}

/* SIDEBAR */
.sidebar {
  width:260px;
  background:#1f2937;
  padding:10px;
  overflow-y:auto;
}

.folder {
  background:#111827;
  padding:8px;
  margin-top:10px;
  border-radius:6px;
}

.folder-title {
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.project {
  margin:5px 0;
  padding:6px;
  border-radius:5px;
  display:flex;
  justify-content:space-between;
  cursor:pointer;
}

/* EDITOR */
textarea {
  width:50%;
  background:#0f172a;
  color:white;
  border:none;
  padding:10px;
  outline:none;
  resize:none;
}

iframe {
  width:50%;
  border:none;
  background:white;
}

.editor {
  display:flex;
  flex:1;
}
</style>
</head>

<body class="dark">

<header>
  <div class="logo">⚡ CodeForge</div>

  <div>
    <button class="btn" onclick="run()">Run</button>
    <button class="btn" onclick="toggleTheme()">Theme</button>
    <button class="btn" onclick="newFolder()">Folder</button>
    <button class="btn" onclick="newProject()">Project</button>
    <button class="btn" onclick="goTutorial()">Tutorial</button>
    <button class="btn" onclick="goCreator()">Creator</button>
  </div>
</header>

<div class="container">

  <div class="sidebar">
    <h3>Projects</h3>
    <div id="folders"></div>
  </div>

  <div class="editor">
    <textarea id="code" placeholder="Start coding..."></textarea>
    <iframe id="output"></iframe>
  </div>

</div>

<script>

/* DATA */
let data = JSON.parse(localStorage.getItem("cf_data") || '{"folders":[]}');
let current = null;

/* SAVE */
function save() {
  localStorage.setItem("cf_data", JSON.stringify(data));
}

/* RENDER */
function render() {
  const root = document.getElementById("folders");
  root.innerHTML = "";

  data.folders.forEach((f, fi) => {

    let folder = document.createElement("div");
    folder.className = "folder";

    folder.innerHTML = `
      <div class="folder-title">
        📁 ${f.name}
        <button class="btn" onclick="deleteFolder(${fi})">X</button>
      </div>
    `;

    f.projects.forEach((p, pi) => {

      let proj = document.createElement("div");
      proj.className = "project";
      proj.style.background = p.color || "#111827";

      proj.innerHTML = `
        <span onclick="load(${fi},${pi})">${p.name}</span>
        <span>
          <button onclick="rename(${fi},${pi})">✏</button>
          <button onclick="color(${fi},${pi})">🎨</button>
          <button onclick="del(${fi},${pi})">🗑</button>
        </span>
      `;

      folder.appendChild(proj);
    });

    root.appendChild(folder);
  });
}

/* FOLDER */
function newFolder() {
  let name = prompt("Folder name:");
  if (!name) return;

  data.folders.push({ name, projects: [] });
  save(); render();
}

function deleteFolder(i) {
  if (!confirm("Delete folder?")) return;
  data.folders.splice(i,1);
  save(); render();
}

/* PROJECT */
function newProject() {
  if (!data.folders.length) {
    alert("Create a folder first");
    return;
  }

  let name = prompt("Project name:");
  if (!name) return;

  data.folders[0].projects.push({
    name,
    code:"<h1>Hello CodeForge</h1>",
    color:"#111827"
  });

  save(); render();
}

function del(fi,pi) {
  data.folders[fi].projects.splice(pi,1);
  save(); render();
}

function rename(fi,pi) {
  let name = prompt("New name:");
  if (!name) return;
  data.folders[fi].projects[pi].name = name;
  save(); render();
}

function color(fi,pi) {
  let c = prompt("Color hex:", "#111827");
  data.folders[fi].projects[pi].color = c;
  save(); render();
}

/* LOAD */
function load(fi,pi) {
  current = {fi,pi};
  document.getElementById("code").value =
    data.folders[fi].projects[pi].code;
  run();
}

/* AUTO SAVE (FIXED) */
document.getElementById("code").addEventListener("input", () => {
  if (!current) return;

  data.folders[current.fi].projects[current.pi].code =
    document.getElementById("code").value;

  save();
});

/* RUN */
function run() {
  document.getElementById("output").srcdoc =
    document.getElementById("code").value;
}

/* THEME */
function toggleTheme() {
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* PAGES */
function goTutorial() {
  window.location.href = "tutorial.html";
}

function goCreator() {
  window.location.href = "creator.html";
}

/* INIT */
render();

</script>

</body>
</html>
