<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeForge</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  transition: 0.3s;
}

/* THEMES */
.dark {
  background: #0b0f1a;
  color: white;
}
.light {
  background: #f4f4f4;
  color: black;
}

header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  background: #111827;
  color: white;
}

.logo { font-weight: bold; color: #38bdf8; }

.btn {
  background: #38bdf8;
  border: none;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 5px;
}

.container {
  display: flex;
  height: 90vh;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #1f2937;
  padding: 10px;
}

.project {
  background: #111827;
  padding: 8px;
  margin: 5px 0;
  cursor: pointer;
  border-radius: 5px;
}

/* EDITOR */
textarea {
  width: 50%;
  border: none;
  padding: 10px;
  resize: none;
  background: #0f172a;
  color: white;
}

iframe {
  width: 50%;
  border: none;
  background: white;
}

.editor {
  display: flex;
  flex: 1;
}
</style>
</head>

<body class="dark">

<header>
  <div class="logo">⚡ CodeForge</div>

  <div>
    <button class="btn" onclick="runCode()">Run</button>
    <button class="btn" onclick="toggleTheme()">Theme</button>
    <button class="btn" onclick="openTutorial()">Tutorial</button>
    <button class="btn" onclick="openCreator()">Creator Page</button>
  </div>
</header>

<div class="container">

  <div class="sidebar">
    <h3>Projects</h3>
    <button class="btn" onclick="newProject()">+ New Project</button>
    <div id="projectList"></div>
  </div>

  <div class="editor">
    <textarea id="code"></textarea>
    <iframe id="output"></iframe>
  </div>

</div>

<script>

let projects = JSON.parse(localStorage.getItem("projects") || "[]");
let currentProject = null;

function saveProjects() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

function renderProjects() {
  const list = document.getElementById("projectList");
  list.innerHTML = "";

  projects.forEach((p, i) => {
    const div = document.createElement("div");
    div.className = "project";
    div.innerText = p.name;
    div.onclick = () => loadProject(i);
    list.appendChild(div);
  });
}

function newProject() {
  let name = prompt("Project name:");
  if (!name) return;

  let project = {
    name: name,
    code: "<h1>Hello CodeForge</h1>"
  };

  projects.push(project);
  saveProjects();
  renderProjects();
}

function loadProject(i) {
  currentProject = i;
  document.getElementById("code").value = projects[i].code;
}

function runCode() {
  let code = document.getElementById("code").value;

  if (currentProject !== null) {
    projects[currentProject].code = code;
    saveProjects();
  }

  document.getElementById("output").srcdoc = code;
}

function toggleTheme() {
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

function openTutorial() {
  window.location.href = "tutorial.html";
}

function openCreator() {
  window.location.href = "creator.html";
}

renderProjects();

</script>

</body>
</html>
