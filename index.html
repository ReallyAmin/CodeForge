<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CodeForge</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  transition: 0.3s;
}

/* THEMES */
.dark {
  background: #0b0f1a;
  color: white;
}
.light {
  background: #f4f4f4;
  color: black;
}

header {
  padding: 12px;
  display: flex;
  justify-content: space-between;
  background: #111827;
  color: white;
  align-items: center;
}

.logo {
  font-weight: bold;
  color: #38bdf8;
}

.btn {
  background: #38bdf8;
  border: none;
  padding: 7px 10px;
  cursor: pointer;
  border-radius: 5px;
  margin-left: 5px;
}

.container {
  display: flex;
  height: 90vh;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #1f2937;
  padding: 10px;
  overflow-y: auto;
}

.project {
  background: #111827;
  padding: 8px;
  margin: 5px 0;
  cursor: pointer;
  border-radius: 5px;
}

.project:hover {
  background: #374151;
}

/* EDITOR */
textarea {
  width: 50%;
  border: none;
  padding: 10px;
  resize: none;
  background: #0f172a;
  color: white;
  outline: none;
}

iframe {
  width: 50%;
  border: none;
  background: white;
}

.editor {
  display: flex;
  flex: 1;
}
</style>
</head>

<body class="dark">

<header>
  <div class="logo">⚡ CodeForge</div>

  <div>
    <button class="btn" onclick="runCode()">Run</button>
    <button class="btn" onclick="toggleTheme()">Theme</button>
    <button class="btn" onclick="openTutorial()">Tutorial</button>
    <button class="btn" onclick="openCreator()">Creator</button>
  </div>
</header>

<div class="container">

  <div class="sidebar">
    <h3>Projects</h3>
    <button class="btn" onclick="newProject()">+ New</button>
    <div id="projectList"></div>
  </div>

  <div class="editor">
    <textarea id="code" placeholder="Start coding..."></textarea>
    <iframe id="output"></iframe>
  </div>

</div>

<script>

let projects = JSON.parse(localStorage.getItem("projects") || "[]");
let currentProject = -1;

/* SAVE */
function save() {
  localStorage.setItem("projects", JSON.stringify(projects));
}

/* RENDER PROJECT LIST */
function render() {
  const list = document.getElementById("projectList");
  list.innerHTML = "";

  projects.forEach((p, i) => {
    let div = document.createElement("div");
    div.className = "project";
    div.innerText = p.name;
    div.onclick = () => load(i);
    list.appendChild(div);
  });
}

/* NEW PROJECT */
function newProject() {
  let name = prompt("Project name:");
  if (!name) return;

  projects.push({
    name: name,
    code: "<h1>Hello CodeForge</h1>"
  });

  save();
  render();
}

/* LOAD PROJECT */
function load(i) {
  currentProject = i;
  document.getElementById("code").value = projects[i].code;
  runCode();
}

/* AUTO SAVE */
document.getElementById("code").addEventListener("input", () => {
  if (currentProject >= 0) {
    projects[currentProject].code = document.getElementById("code").value;
    save();
  }
});

/* RUN CODE */
function runCode() {
  let code = document.getElementById("code").value;
  document.getElementById("output").srcdoc = code;
}

/* THEME */
function toggleTheme() {
  document.body.classList.toggle("light");
  document.body.classList.toggle("dark");
}

/* PAGES */
function openTutorial() {
  window.location.href = "tutorial.html";
}

function openCreator() {
  window.location.href = "creator.html";
}

/* INIT */
render();

if (projects.length > 0) {
  load(0);
}

runCode();

</script>

</body>
</html>
